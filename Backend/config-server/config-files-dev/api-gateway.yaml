spring:
  application:
    name: api-gateway

  codec:
    max-in-memory-size: 20MB
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**

        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/deliveries/**
            - Path=/riders/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**

        - id: notification-service
          uri: lb://payment-service
          predicates:
            - Path=/notifications/**

        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/v1/restaurant/**
            - Path=/api/v1/menu/**
            - Path=/api/v1/category/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/



